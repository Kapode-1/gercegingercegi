backend:
  name: github
  repo: Kapode-1/gercegingercegi
  branch: main
  base_url: https://tayyip-decap-oauth.mnsntayp.workers.dev
  auth_endpoint: auth
  use_graphql: true

site_url: https://tayyip-minsin-policy-atlas.pages.dev
logo_url: /assets/tayyip-minsin-social.jpg
locale: tr
publish_mode: simple
media_folder: "assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: "site_content"
    label: "Site İçeriği"
    files:
      - name: "publications"
        label: "Yayınlar ve Yazılar"
        file: "content/publications.json"
        format: "json"
        fields:
          - label: "Yayınlar"
            name: "items"
            widget: "list"
            summary: "{{fields.title}} — {{fields.publisher}}"
            add_to_top: true
            fields:
              - {label: "Başlık", name: "title", widget: "string"}
              - {label: "URL kısa adı", name: "slug", widget: "string", hint: "Küçük harf, boşluksuz: ornek-yazi-basligi"}
              - {label: "Yayıncı", name: "publisher", widget: "select", options: ["ODAP", "Objektürk", "Kişisel Site", "Diğer"]}
              - {label: "Dosya türü", name: "type", widget: "select", options: ["Policy Brief", "Analiz", "Makale", "Commentary", "Climate File"]}
              - {label: "Yayın tarihi", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "DD.MM.YYYY", time_format: false}
              - {label: "Dil", name: "language", widget: "select", options: ["TR", "EN"]}
              - {label: "Bölge", name: "region", widget: "string"}
              - {label: "Özet", name: "summary", widget: "text"}
              - {label: "Kapak görseli", name: "image", widget: "image", required: false}
              - {label: "Dış bağlantı", name: "external_url", widget: "string", required: false, hint: "Yazı başka sitede yayımlandıysa tam bağlantı"}
              - {label: "Öne çıkar", name: "featured", widget: "boolean", default: false}
              - {label: "Tam metin", name: "body", widget: "markdown", required: false}
              - label: "Kaynakça"
                name: "references"
                widget: "list"
                required: false
                field: {label: "Kaynak", name: "reference", widget: "string"}
              - {label: "Haritada göster", name: "show_on_map", widget: "boolean", default: true}
              - {label: "Ana ülke / bölge", name: "primary_country", widget: "select", required: false, options: ["Türkiye", "Libya", "Körfez", "Suudi Arabistan", "Kolombiya", "İsrail / Kudüs", "Fas", "Batı Sahra", "Cezayir", "Nijer", "Çad", "İtalya", "Suriye", "Irak", "İran", "Mısır", "Ürdün", "Lübnan", "Katar", "BAE", "Kuveyt", "Yunanistan", "Brüksel / AB", "Panama"]}
              - {label: "İlgili ülkeler", name: "related_countries", widget: "select", multiple: true, required: false, options: ["Türkiye", "Libya", "Körfez", "Suudi Arabistan", "Kolombiya", "İsrail / Kudüs", "Fas", "Batı Sahra", "Cezayir", "Nijer", "Çad", "İtalya", "Suriye", "Irak", "İran", "Mısır", "Ürdün", "Lübnan", "Katar", "BAE", "Kuveyt", "Yunanistan", "Brüksel / AB", "Panama"]}
              - {label: "Harita paneli açıklaması", name: "map_description", widget: "text", required: false}
              - {label: "Özel yatay konum (%)", name: "map_x", widget: "number", required: false, min: 0, max: 100, value_type: "float"}
              - {label: "Özel dikey konum (%)", name: "map_y", widget: "number", required: false, min: 0, max: 100, value_type: "float"}
      - name: "profile"
        label: "Profil ve İletişim"
        file: "content/profile.json"
        format: "json"
        fields:
          - {label: "Ana unvan", name: "job_title", widget: "string", default: "İklim ve Enerji Politikaları Araştırmacısı", required: false}
          - {label: "Kurum / eğitim satırı", name: "affiliation", widget: "string", default: "İÜ Siyaset Bilimi ve Uluslararası İlişkiler", required: false}
          - {label: "Kısa tanıtım", name: "intro", widget: "text", required: false}
          - {label: "Hakkımda", name: "about", widget: "markdown", required: false}
          - label: "Araştırma odakları"
            name: "focus_areas"
            widget: "list"
            min: 0
            required: false
            max: 6
            field: {label: "Odak", name: "focus", widget: "string"}
          - {label: "Profil fotoğrafı", name: "portrait", widget: "image", required: false, default: "/assets/tayyip-minsin-portrait.jpg"}
          - {label: "Konum etiketi", name: "location", widget: "string", default: "İSTANBUL", required: false}
          - {label: "Portre alt etiketi", name: "portrait_note", widget: "string", default: "RESEARCH • WRITING • DIPLOMACY", required: false}
          - {label: "Manifesto üst etiketi", name: "manifesto_kicker", widget: "string", default: "POLICY / STRATEGY / GOVERNANCE", required: false}
          - {label: "Manifesto cümlesi", name: "manifesto", widget: "text", required: false}
          - {label: "Ana alıntı", name: "quote", widget: "text", required: false}
          - {label: "E-posta", name: "email", widget: "string", required: false}
          - {label: "Instagram", name: "instagram", widget: "string", required: false}
          - {label: "LinkedIn", name: "linkedin", widget: "string", required: false}
          - {label: "X", name: "x", widget: "string", required: false}
          - {label: "Objektürk profili", name: "objekturk", widget: "string", required: false}
          - {label: "CV durumu", name: "cv_status", widget: "string", default: "CV / PUBLIC VERSION IN PREPARATION", required: false}
          - {label: "İş birliği durumu", name: "availability", widget: "string", default: "AVAILABLE FOR SELECTED COLLABORATIONS", required: false}
          - {label: "Google açıklaması", name: "seo_description", widget: "text", required: false}

      - name: "social_dispatches"
        label: "LinkedIn Gönderileri"
        file: "content/social-dispatches.json"
        format: "json"
        fields:
          - label: "Gönderiler"
            name: "items"
            widget: "list"
            required: false
            add_to_top: true
            summary: "{{fields.title}} — {{fields.date}}"
            fields:
              - {label: "Başlık / kısa not", name: "title", widget: "string"}
              - {label: "LinkedIn gönderi URL'si", name: "url", widget: "string", hint: "Herkese açık LinkedIn gönderisinin tam bağlantısı"}
              - {label: "Tarih", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "DD.MM.YYYY", time_format: false}
              - {label: "Kısa açıklama", name: "summary", widget: "text", required: false}
              - {label: "Sitede göster", name: "visible", widget: "boolean", default: true, required: false}
              - {label: "Öne çıkar", name: "featured", widget: "boolean", default: false, required: false}
