ss="ai-suggestions"><button type="button">Libya analizlerini karşılaştır.</button><button type="button">SKDM Türkiye için neden önemli?</button><button type="button">İngilizce yayınları göster.</button><button type="button">Körfez güvenliği üzerine ne okumalıyım?</button></div><form class="ai-form" id="ai-form"><div class="ai-modes"><label><input type="radio" name="ai-mode" value="atlas" checked> Yalnızca Policy Atlas</label><label><input type="radio" name="ai-mode" value="web"> Policy Atlas + Web</label></div><textarea id="ai-question" maxlength="500" required placeholder="Sorunu yaz…"></textarea><div class="ai-actions"><div class="cf-turnstile" data-sitekey="0x4AAAAAAGGWiZO0mM8X9BSX"></div><button type="submit">ATLAS’A SOR ↗</button></div><p class="ai-status" id="ai-status" role="status" aria-live="polite"></p></form></section><section class="ai-answer" id="ai-answer"><h2>Yanıt</h2><div class="ai-text" id="ai-text"></div><div class="ai-sources" id="ai-sources"></div><p class="ai-note" id="ai-note"></p></section></main><script>const requestedMode=new URLSearchParams(location.search).get('mode');if(requestedMode==='web'||requestedMode==='atlas'){const radio=document.querySelector(`[name=\"ai-mode\"][value=\"${requestedMode}\"]`);if(radio)radio.checked=true;}const ENDPOINT='https://policy-atlas-ai.mnsntayp.workers.dev/ask';const form=document.getElementById('ai-form'),q=document.getElementById('ai-question'),status=document.getElementById('ai-status'),box=document.getElementById('ai-answer'),text=document.getElementById('ai-text'),sources=document.getElementById('ai-sources'),note=document.getElementById('ai-note');document.querySelectorAll('.ai-suggestions button').forEach(b=>b.onclick=()=>{q.value=b.textContent;q.focus()});form.addEventListener('submit',async e=>{e.preventDefault();const token=document.querySelector('[name="cf-turnstile-response"]')?.value;if(!token){status.textContent='Lütfen insan doğrulamasını tamamla.';return}status.textContent='Kaynaklar taranıyor…';try{const r=await fetch(ENDPOINT,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({question:q.value,mode:document.querySelector('[name=\"ai-mode\"]:checked')?.value||'atlas',turnstileToken:token})});const j=await r.json();if(!r.ok)throw Error(j.error||'İstek başarısız');text.textContent=(j.webNotice?j.webNotice+'\n\n':'')+j.answer;sources.innerHTML='<b>KAYNAKLAR</b>'+j.sources.map(x=>`<a href="${x.url}" target="_blank" rel="noopener">[${x.id}] ${x.title} — ${x.publisher}</a>`).join('');note.textContent=j.disclaimer;box.classList.add('active');status.textContent='';const reduceMotion=window.matchMedia('(prefers-reduced-motion: reduce)').matches;requestAnimationFrame(()=>box.scrollIntoView({behavior:reduceMotion?'auto':'smooth',block:'start'}))}catch(err){status.textContent=err.message}finally{if(window.turnstile)turnstile.reset()}});</script><script src="/assets/language-control.js" defer></script><script src="/assets/pointer-hardening.js" defer></script><script src="/assets/menu-layout-repair.js" defer></script><script src="/assets/menu-v2510.js?v=2510" defer></script></body></html>
